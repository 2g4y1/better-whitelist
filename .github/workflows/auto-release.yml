name: Auto-Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.ref }}
  # Never cancel a run that may already be publishing a release
  cancel-in-progress: false

jobs:
  check:
    name: Check
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.guard.outputs.RELEASE }}

    steps:
      - name: Checkout the commit CI ran on
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Skip when a release tag points at this commit
        id: guard
        run: |
          set -euo pipefail
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release-Tag vorhanden - Release.yml uebernimmt, kein Auto-Release"
            echo "RELEASE=false" >> "$GITHUB_OUTPUT"
          else
            echo "RELEASE=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Pre-Release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the commit CI ran on
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Collect release metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(mvn --batch-mode -q -DforceStdout help:evaluate -Dexpression=project.version)"
          SHA="$(git rev-parse --short HEAD)"
          TAG="v${VERSION}-build.$(git rev-list --count HEAD)"

          {
            echo "VERSION=$VERSION"
            echo "SHA=$SHA"
            echo "TAG=$TAG"
            echo "DATE=$(date +'%Y-%m-%d')"
            echo "ASSET=better-whitelist-${TAG}-${SHA}.jar"
          } >> "$GITHUB_OUTPUT"

      - name: Stop if the build tag already exists
        id: exists
        run: |
          set -euo pipefail
          if git rev-parse "${{ steps.meta.outputs.TAG }}" >/dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare assets
        if: steps.exists.outputs.EXISTS == 'false'
        run: |
          set -euo pipefail
          cd target
          mv "better-whitelist-${{ steps.meta.outputs.VERSION }}.jar" "${{ steps.meta.outputs.ASSET }}"
          sha256sum "${{ steps.meta.outputs.ASSET }}" > "${{ steps.meta.outputs.ASSET }}.sha256"

      - name: Create pre-release
        if: steps.exists.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Auto Release ${{ steps.meta.outputs.TAG }}
          draft: false
          prerelease: true
          make_latest: 'false'
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            🤖 Automatisches Pre-Release

            **Build-Datum:** ${{ steps.meta.outputs.DATE }}
            **Commit:** ${{ github.event.workflow_run.head_commit.message }}
            **Commit-ID:** ${{ steps.meta.outputs.SHA }}

            Die SHA256-Pruefsumme liegt als `.sha256` neben dem Jar.

            Diese Version wurde automatisch nach erfolgreichem CI-Durchlauf erstellt.
          files: |
            target/${{ steps.meta.outputs.ASSET }}
            target/${{ steps.meta.outputs.ASSET }}.sha256
