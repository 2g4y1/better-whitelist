name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run that may already be publishing a release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # verify runs the tests as well - a release must not skip them
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Determine version
        id: ver
        run: |
          set -euo pipefail
          POM_VERSION="$(mvn --batch-mode -q -DforceStdout help:evaluate -Dexpression=project.version)"

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            TAG="${{ inputs.version }}"
            # Tolerate both "1.2.0" and "v1.2.0" as manual input
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
            PRERELEASE='${{ inputs.prerelease }}'
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE='false'
          fi

          # The tag has to match the version in the pom, otherwise the release
          # would ship a jar that is named differently from the tag.
          if [ "$TAG" != "v${POM_VERSION}" ]; then
            echo "::error::Tag '$TAG' passt nicht zur pom.xml-Version '$POM_VERSION' - bitte die Version in der pom.xml anpassen"
            exit 1
          fi

          {
            echo "TAG=$TAG"
            echo "PRERELEASE=$PRERELEASE"
            echo "SHA=$(git rev-parse --short HEAD)"
            echo "ASSET=better-whitelist-${TAG}.jar"
            echo "POM_VERSION=$POM_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare assets
        run: |
          set -euo pipefail
          cd target
          mv "better-whitelist-${{ steps.ver.outputs.POM_VERSION }}.jar" "${{ steps.ver.outputs.ASSET }}"
          sha256sum "${{ steps.ver.outputs.ASSET }}" > "${{ steps.ver.outputs.ASSET }}.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: Release ${{ steps.ver.outputs.TAG }}
          draft: false
          prerelease: ${{ steps.ver.outputs.PRERELEASE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 📦 Installation

            Jar herunterladen und in den `plugins`-Ordner des Servers kopieren.

            **Voraussetzungen:** Paper 26.2+ und Java 25+

            **Commit:** ${{ steps.ver.outputs.SHA }}
            **SHA256:** siehe `${{ steps.ver.outputs.ASSET }}.sha256`
          files: |
            target/${{ steps.ver.outputs.ASSET }}
            target/${{ steps.ver.outputs.ASSET }}.sha256
