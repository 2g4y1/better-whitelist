name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Paper 26.x ships Java 25 bytecode - the API cannot be read by an older JDK.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # verify runs compile, test and package in a single reactor pass
      - name: Build
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify artifact
        run: |
          set -euo pipefail
          VERSION="$(mvn --batch-mode -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="target/better-whitelist-${VERSION}.jar"

          if [ ! -f "$JAR" ]; then
            echo "::error::$JAR wurde nicht gebaut"
            exit 1
          fi

          # Without a plugin.yml the server refuses to load the plugin at all.
          # jar(1) is guaranteed to be present because setup-java ran before this.
          if ! jar tf "$JAR" | grep -qx 'plugin.yml'; then
            echo "::error::plugin.yml fehlt im Jar - das Plugin waere nicht ladbar"
            exit 1
          fi

          echo "✅ $JAR enthaelt eine plugin.yml"
          ls -lh "$JAR"

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: better-whitelist-${{ github.sha }}
          path: target/better-whitelist-*.jar
          retention-days: 7
          if-no-files-found: error
